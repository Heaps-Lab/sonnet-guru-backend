user nginx;
worker_processes 8;  # Match Ryzen 8 threads
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

# Optimized for distributed architecture
worker_rlimit_nofile 200000;

events {
    worker_connections 8000;  # 8 workers × 8000 = 64,000 connections
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging optimized for high traffic
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time" '
                   'upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log main buffer=64k flush=5s;
    
    # Performance tuning for 2000+ concurrent users
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 2;
    client_max_body_size 100M;
    
    # Hide server info
    server_tokens off;
    
    # Buffer optimization for video streaming
    client_body_buffer_size 256k;
    client_header_buffer_size 8k;
    large_client_header_buffers 8 32k;
    output_buffers 4 64k;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting for distributed setup
    limit_req_zone $binary_remote_addr zone=api:50m rate=500r/m;
    limit_req_zone $binary_remote_addr zone=login:20m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=video:100m rate=1000r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=perip:50m;
    
    # Upstream for 6 app instances
    upstream sonnet_backend {
        least_conn;
        server app1:3000 max_fails=3 fail_timeout=30s weight=1;
        server app2:3000 max_fails=3 fail_timeout=30s weight=1;
        server app3:3000 max_fails=3 fail_timeout=30s weight=1;
        server app4:3000 max_fails=3 fail_timeout=30s weight=1;
        server app5:3000 max_fails=3 fail_timeout=30s weight=1;
        server app6:3000 max_fails=3 fail_timeout=30s weight=1;
        keepalive 128;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # Video cache for better performance
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=video_cache:200m 
                     max_size=10g inactive=120m use_temp_path=off;

    # File cache for static assets
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    include /etc/nginx/conf.d/*.conf;
}