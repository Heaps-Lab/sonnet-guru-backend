user nginx;
worker_processes 8;  # Match your 8 threads
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

# Optimized for high performance
worker_rlimit_nofile 100000;
worker_connections_per_process 4000;

events {
    worker_connections 4000;  # 8 workers × 4000 = 32,000 connections
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations for 1000+ users
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    
    # Hide version for security
    server_tokens off;
    
    # Buffer optimization for video streaming
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    output_buffers 2 32k;
    postpone_output 1460;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting zones for 1000+ users
    limit_req_zone $binary_remote_addr zone=api:20m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=login:20m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=video:20m rate=500r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=perip:20m;
    
    # Upstream configuration for 4 app instances
    upstream sonnet_backend {
        least_conn;
        server app1:3000 max_fails=3 fail_timeout=30s weight=1;
        server app2:3000 max_fails=3 fail_timeout=30s weight=1;
        server app3:3000 max_fails=3 fail_timeout=30s weight=1;
        server app4:3000 max_fails=3 fail_timeout=30s weight=1;
        keepalive 64;
        keepalive_requests 1000;
    }

    # Cache for static content
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=video_cache:100m 
                     max_size=5g inactive=60m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}