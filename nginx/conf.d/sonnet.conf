server {
    listen 80;
    server_name server.sonnetguru.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name server.sonnetguru.com;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/server.sonnetguru.com.crt;
    ssl_private_key /etc/nginx/ssl/server.sonnetguru.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Connection limiting
    limit_conn perip 20;
    
    # Auth endpoints with stricter rate limiting
    location /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://sonnet_backend;
        include /etc/nginx/conf.d/proxy_params;
    }
    
    location /api/v1/auth/register {
        limit_req zone=register burst=15 nodelay;
        proxy_pass http://sonnet_backend;
        include /etc/nginx/conf.d/proxy_params;
    }
    
    # File upload endpoints
    location /api/v1/modules/*/upload-sheet {
        client_max_body_size 50M;
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://sonnet_backend;
        include /etc/nginx/conf.d/proxy_params;
        
        # Increase timeouts for file uploads
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    location /api/v1/teacher-applications {
        client_max_body_size 10M;
        limit_req zone=api burst=3 nodelay;
        proxy_pass http://sonnet_backend;
        include /etc/nginx/conf.d/proxy_params;
    }
    
    # General API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://sonnet_backend;
        include /etc/nginx/conf.d/proxy_params;
    }
    
    # Static file serving with security
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Security for uploaded files - prevent script execution
        location ~* \.(php|php3|php4|php5|phtml|pl|py|jsp|asp|sh|cgi|exe|bat)$ {
            deny all;
            return 403;
        }
        
        # Only allow specific file types
        location ~* \.(pdf|jpg|jpeg|png|gif|webp|doc|docx|xlsx|xls|txt)$ {
            try_files $uri =404;
        }
    }
    
    # Health check endpoint (no rate limiting)
    location /health {
        access_log off;
        proxy_pass http://sonnet_backend/health;
        proxy_connect_timeout 3s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }
    
    # Swagger documentation (only in development)
    location /api/docs {
        # Comment out in production or add IP restrictions
        # allow 192.168.1.0/24;
        # deny all;
        proxy_pass http://sonnet_backend/api/docs;
        include /etc/nginx/conf.d/proxy_params;
    }
    
    # Block common attack vectors
    location ~ /\. {
        deny all;
        return 404;
    }
    
    location ~ ~$ {
        deny all;
        return 404;
    }
    
    # Default location
    location / {
        proxy_pass http://sonnet_backend;
        include /etc/nginx/conf.d/proxy_params;
    }
    
    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        internal;
        return 404 '{"error": "Not Found", "statusCode": 404}';
        add_header Content-Type application/json;
    }
    
    location = /50x.html {
        internal;
        return 500 '{"error": "Internal Server Error", "statusCode": 500}';
        add_header Content-Type application/json;
    }
}